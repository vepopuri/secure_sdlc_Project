line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S608", "E501", "UP017"]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
