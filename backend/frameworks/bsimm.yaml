key: bsimm
name: Building Security In Maturity Model
version: "15"
short_name: BSIMM
description: >-
  BSIMM software security framework - four domains and twelve practices. Scores express
  the observed activity level (1-3) within each practice.
source_url: https://www.blackduck.com/services/bsimm-software-security-maturity-model.html
license_note: BSIMM is published under CC BY-SA 4.0. Activity descriptions are summarised.
scale:
  min: 0
  max: 3
  step: 0.5
  default_target: 2
  labels:
    0: No activities observed
    1: Level 1 activities observed
    2: Level 2 activities observed
    3: Level 3 activities observed
level_criteria:
  1: Foundational activities are performed (commonly observed across BSIMM participants).
  2: Intermediate activities are performed consistently across the portfolio.
  3: Advanced activities are performed and continuously improved.
domains:
  - id: GOV
    name: Governance
    practices:
      - id: SM
        name: Strategy & Metrics
        description: Planning, assigning roles and responsibilities, identifying software security goals, budgeting and metrics.
        capabilities: {governance_strategy: 1.0, security_metrics: 0.9}
      - id: CP
        name: Compliance & Policy
        description: Identifying controls for compliance regimes, developing contractual controls and auditing against policy.
        capabilities: {policy_compliance: 1.0, supplier_risk: 0.4}
      - id: T
        name: Training
        description: Enhancing the security knowledge of everyone involved in delivery, including role-based training.
        capabilities: {training_awareness: 1.0}
  - id: INT
    name: Intelligence
    practices:
      - id: AM
        name: Attack Models
        description: Capturing information used to think like an attacker - threat modeling, abuse cases and technology-specific attack patterns.
        capabilities: {threat_modeling: 1.0, risk_management: 0.3}
      - id: SFD
        name: Security Features & Design
        description: Creating usable security patterns and secure-by-design frameworks for major security controls.
        capabilities: {secure_architecture: 1.0, identity_access: 0.4, data_protection: 0.3}
      - id: SR
        name: Standards & Requirements
        description: Eliciting explicit security requirements, recommended COTS and open source, and secure coding standards.
        capabilities: {security_requirements: 0.9, secure_coding: 0.8, sca: 0.3}
  - id: SSDL
    name: SSDL Touchpoints
    practices:
      - id: AA
        name: Architecture Analysis
        description: Capturing software architecture in diagrams and applying risk and threat lists to identify and fix flaws.
        capabilities: {secure_architecture: 0.9, threat_modeling: 0.7}
      - id: CR
        name: Code Review
        description: Using code review tools, tailored rules, manual review and tracking of results.
        capabilities: {code_review: 1.0, sast: 1.0}
      - id: ST
        name: Security Testing
        description: Pre-release testing including integrating security into QA, boundary and fuzz testing.
        capabilities: {security_testing_requirements: 1.0, dast: 0.8}
  - id: DEP
    name: Deployment
    practices:
      - id: PT
        name: Penetration Testing
        description: Using external and internal penetration testers to find problems and feed results into defect management.
        capabilities: {penetration_testing: 1.0}
      - id: SE
        name: Software Environment
        description: OS and platform patching, web application firewalls, installation and configuration, containers and orchestration, code signing.
        capabilities: {environment_hardening: 0.9, container_security: 0.7, artifact_signing: 0.5, iac_security: 0.4}
      - id: CMVM
        name: Configuration Management & Vulnerability Management
        description: Patching and updating applications, version control, defect tracking and incident handling.
        capabilities: {vulnerability_management: 1.0, incident_response: 0.6, release_management: 0.4}
