name: DB migrate

# Runs Alembic migrations and seeds the framework catalogue against the production database.
# Requires the repository secret DATABASE_URL (the Neon connection string; postgres:// and
# postgresql:// both work). Runs on demand, and automatically when migrations or framework
# data change on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/alembic/**
      - backend/frameworks/**
      - backend/app/models.py

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: Seed frameworks
        run: python -m scripts.seed
      - name: Show current revision
        run: alembic current
